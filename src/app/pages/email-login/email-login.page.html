<ion-content class="email-login-page" fullscreen="true" [scrollY]="false">

  <!-- DECORATIVE LEAVES -->
  <img src="assets/Group 85.png" class="leaf-top-left" alt="">
  <img src="assets/otrs h.png" class="leaf-top-right" alt="">

  <!-- BOTTOM WAVE -->
  <img src="assets/parte del login.png" class="bottom-wave" alt="">


  <div class="el-wrapper">

    <!-- LOGO -->
    <div class="logo-section">
      <div class="logo-ring">
        <img src="assets/logo 2.png" alt="GreenBox Logo" class="logo-img">
      </div>
      <h1 class="brand-name">GREENBOX</h1>
      <p class="brand-tagline">Cultivo inteligente a tu alcance</p>
    </div>

    <!-- FORM -->
    <div class="form-card">

      <div class="field-group">
        <label class="field-label">Correo Electronico</label>
        <div class="input-wrap">
          <input type="email" class="field-input" placeholder="example@example.com"
            [(ngModel)]="email" (keyup.enter)="onLogin()">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Contraseña</label>
        <div class="input-wrap">
          <input [type]="showPass ? 'text' : 'password'" class="field-input"
            placeholder="••••••••••" [(ngModel)]="password" (keyup.enter)="onLogin()">
          <button class="eye-btn" (click)="togglePass()">
            <ion-icon [name]="showPass ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Mensaje -->
      <div *ngIf="mensaje" class="msg-box"
        [class.error]="mensaje.includes('⚠️') || mensaje.includes('❌')"
        [class.success]="mensaje.includes('✅')">
        {{ mensaje }}
      </div>

      <!-- Botón principal -->
      <button class="main-btn" (click)="onLogin()" [disabled]="loading">
        <ion-spinner name="crescent" *ngIf="loading"></ion-spinner>
        <span *ngIf="!loading">Iniciar Sesión</span>
      </button>

      <!-- Divisor -->
      <div class="divider-row">
        <span class="divider-line"></span>
        <span class="divider-text">Continua con</span>
        <span class="divider-line"></span>
      </div>

      <!-- Botones sociales - exactos del mockup -->
      <div class="social-row">
        <!-- Google con G multicolor -->
        <button class="social-btn google-btn" (click)="onGoogleLogin()">
          <svg class="google-g" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <!-- Cuenta GreenBox -->
        <button class="social-btn greenbox-btn" (click)="goCode()">
          <ion-icon name="leaf-outline"></ion-icon>
          Cuenta GreenBox
        </button>
      </div>

      <!-- Crear cuenta -->
      <p class="switch-link" (click)="goRegister()">
        ¿No tienes una cuenta? <span>Crea una</span>
      </p>

    </div>
  </div>

</ion-content>
