<ion-content class="login-page" [scrollY]="true" fullscreen="true">

  <!-- DECORATIVE LEAVES -->
  <img src="assets/hoja.png"   class="leaf leaf-top-left"  alt="">
  <img src="assets/otrs h.png" class="leaf leaf-top-right" alt="">
  <img src="assets/ultima.png" class="leaf leaf-bot-left"  alt="">
  <img src="assets/ho.png"     class="leaf leaf-bot-right" alt="">

  <!-- BOTTOM WAVE GRAPHIC -->
  <img src="assets/parte del login.png" class="bottom-wave" alt="">

  <div class="login-wrapper">

    <!-- LOGO SECTION -->
    <div class="logo-section">
      <div class="logo-ring">
        <img src="assets/logo 2.png" alt="GreenBox Logo" class="logo-img">
      </div>
      <h1 class="brand-name">GREENBOX</h1>
      <p class="brand-tagline">Cultivo inteligente a tu alcance</p>
    </div>

    <!-- FORM: CÓDIGO DE ACCESO -->
    <div class="form-card">

      <div class="field-group">
        <label class="field-label">
          <ion-icon name="lock-closed-outline"></ion-icon>
          Código de Acceso
        </label>
        <div class="custom-input-wrap">
          <ion-icon name="key-outline" class="input-prefix-icon"></ion-icon>
          <input type="text" class="custom-input padded-left"
            placeholder="Ingresa tu código"
            [(ngModel)]="code"
            (keyup.enter)="onAccess()">
        </div>
      </div>

      <!-- Mensaje de Error/Éxito -->
      <div *ngIf="mensaje" class="mensaje"
        [class.error]="mensaje.includes('❌') || mensaje.includes('⚠️')"
        [class.success]="mensaje.includes('✅')">
        <ion-icon [name]="mensaje.includes('✅') ? 'checkmark-circle' : 'alert-circle'" class="mensaje-icon"></ion-icon>
        {{ mensaje }}
      </div>

      <!-- Botón Acceder -->
      <button class="main-btn" (click)="onAccess()" [disabled]="loading">
        <ion-spinner name="crescent" *ngIf="loading"></ion-spinner>
        <span *ngIf="!loading">Acceder</span>
      </button>

      <div class="divider-row">
        <span class="divider-line"></span>
      </div>

      <!-- Footer Info -->
      <div class="footer-note">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        Monitoreo en tiempo real de tu cultivo
      </div>

      <!-- Navegación a otras pantallas -->
      <div class="divider-row" style="margin-top: 8px;">
        <span class="divider-line"></span>
        <span class="divider-text">O ingresa con</span>
        <span class="divider-line"></span>
      </div>

      <div class="social-row">
        <button class="social-btn" (click)="goEmailLogin()">
          <ion-icon name="mail-outline"></ion-icon>
          Email
        </button>
        <button class="social-btn green" (click)="goRegister()">
          <ion-icon name="leaf-outline"></ion-icon>
          Crear cuenta
        </button>
      </div>

    </div>

  </div>

</ion-content>
